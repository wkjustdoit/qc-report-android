name: Build Android APK

# 推送到 main 时自动构建；也可在 Actions 页面手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython==0.29.36"

      - name: Install system build dependencies (libtool for libffi autoreconf)
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libltdl-dev build-essential

      - name: Build APK (debug)
        run: buildozer android debug
        env:
          # 自动接受 SDK / NDK / 许可协议
          BUILDOZER_WARN_ON_ROOT: "0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qc-report-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Publish APK to Release (public downloadable asset)
        uses: softprops/action-gh-release@v2
        with:
          tag: apk-build-${{ github.run_number }}
          name: QC Report APK (build ${{ github.run_number }})
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
